name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Firestore EmulatorがJavaを必要とする(Security Rulesのテスト用)。
      # firebase-toolsはJDK 21以上を要求する。
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: pnpm install --frozen-lockfile

      - run: pnpm run ci

      - run: pnpm --filter functions run test:rules

      # SHARE-005: 作成→招待→受諾→追加→完了→権限喪失の2ユーザー通し(Emulator)。
      - run: pnpm --filter functions exec firebase emulators:exec --only auth,firestore,functions --project soroe-1850a 'pnpm --filter mobile run e2e:share'

      # OFF-003 / AC-03: 機内モード(disableNetwork)での追加・編集・完了・削除、復帰後の同期、同時編集の競合(Emulator)。
      - run: pnpm --filter functions exec firebase emulators:exec --only auth,firestore,functions --project soroe-1850a 'pnpm --filter mobile run e2e:offline'

      # TMPL-004 / AC-04: 公式テンプレートから作成、マイテンプレート保存・Free上限・独立性(Emulator)。
      - run: pnpm --filter functions exec firebase emulators:exec --only auth,firestore,functions --project soroe-1850a 'pnpm run templates:seed && pnpm --filter mobile run e2e:templates'

      # AI-005 / AC-05: AI生成の回数・失敗時の返却・保存(Emulator、偽のAIクライアント)。
      - run: AI_CLIENT=fake pnpm --filter functions exec firebase emulators:exec --only auth,firestore,functions --project soroe-1850a 'pnpm --filter mobile run e2e:ai'
